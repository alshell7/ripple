<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ripple: see what every code change ripples into">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2745"/>
      <stop offset=".55" stop-color="#0F4566"/>
      <stop offset="1" stop-color="#0D6466"/>
    </linearGradient>
    <radialGradient id="glow" cx=".77" cy=".5" r=".45">
      <stop offset="0" stop-color="#5FD4E8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#5FD4E8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#sea)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <g fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="1.2">
      <circle cx="925" cy="170" r="48"/>
      <circle cx="925" cy="170" r="92"/>
      <circle cx="925" cy="170" r="136"/>
    </g>
    <g fill="none" stroke="#9BE7F2" stroke-width="2.2">
      <circle cx="925" cy="170" r="6" stroke-opacity="0">
        <animate attributeName="r" values="6;250" dur="4.8s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".95;0" dur="4.8s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="925" cy="170" r="6" stroke-opacity="0">
        <animate attributeName="r" values="6;250" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".95;0" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="925" cy="170" r="6" stroke-opacity="0">
        <animate attributeName="r" values="6;250" dur="4.8s" begin="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".95;0" dur="4.8s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="925" cy="170" r="7" fill="#E8FBFF"/>

    <circle cx="925" cy="218" r="8" fill="#E24B4A">
      <animate attributeName="r" values="8;10;8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="925" cy="78" r="7" fill="#EF9F27">
      <animate attributeName="r" values="7;9;7" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="807" cy="238" r="7" fill="#378ADD">
      <animate attributeName="r" values="7;9;7" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
      <text x="80" y="104" font-size="15" font-weight="600" letter-spacing="3" fill="#9BE7F2">A CLAUDE CODE MOD</text>
      <text x="76" y="186" font-size="92" font-weight="800" letter-spacing="-2" fill="#FFFFFF">Ripple</text>
      <text x="80" y="234" font-size="27" fill="#DDF6FA">See what every code change ripples into.</text>
      <text x="80" y="280" font-size="17" fill="#A9DDE6">💸 Cost   🔒 Security   🛟 Reliability   ⚡ Efficiency   📈 Scale   🧩 Stack</text>
    </g>
  </g>
</svg>
